<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1769d1">
<link rel="manifest" href="manifest.json">

<title>Gestor de Demandas</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033
}

header{
  background:#1769d1;
  color:white;
  padding:22px 18px;
  border-radius:0 0 24px 24px
}

header h1{
  margin:0;
  font-size:24px
}

header p{
  margin:7px 0 0;
  opacity:.9
}

main{
  max-width:760px;
  margin:auto;
  padding:18px
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin:18px 0
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 2px 10px #0000000d
}

.card strong{
  font-size:28px;
  display:block
}

.card span{
  color:#687386;
  font-size:13px
}

button{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-weight:bold;
  cursor:pointer
}

.primary{
  background:#1769d1;
  color:white;
  width:100%;
  font-size:16px
}

.secondary{
  background:#eef5ff;
  color:#1769d1;
  width:100%;
  font-size:15px
}

.danger{
  background:#ffecec;
  color:#c62828;
  width:100%;
  font-size:15px
}

section{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-top:16px;
  box-shadow:0 2px 10px #0000000d
}

h2{
  font-size:19px;
  margin-top:0
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 6px
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d9e0ea;
  border-radius:10px;
  font-size:15px
}

textarea{
  min-height:100px;
  resize:vertical
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.success{
  display:none;
  background:#e7f7ed;
  color:#14753c;
  padding:12px;
  border-radius:10px;
  margin-top:12px
}

.list{
  margin-top:15px
}

.item{
  border:1px solid #e1e7ef;
  border-radius:12px;
  padding:13px;
  margin:9px 0;
  cursor:pointer;
  background:#fff;
  transition:.15s
}

.item:hover{
  background:#f7faff;
  border-color:#1769d1
}

.item b{
  display:block;
  margin-bottom:5px
}

.tag{
  display:inline-block;
  background:#edf4ff;
  color:#1769d1;
  border-radius:20px;
  padding:5px 9px;
  font-size:11px
}

.search{
  margin-top:10px
}

.detalhes{
  display:none
}

.detalhe-box{
  background:#f7f9fc;
  border-radius:12px;
  padding:13px;
  margin:8px 0
}

.detalhe-label{
  font-size:12px;
  color:#687386;
  font-weight:bold
}

.detalhe-valor{
  margin-top:4px;
  font-size:15px;
  word-break:break-word
}

.botoes-detalhes{
  display:grid;
  gap:10px;
  margin-top:15px
}

.edicao{
  display:none
}

@media(max-width:520px){
  .row{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
<h1>Gestor de Demandas</h1>
<p>Registro e acompanhamento das solicitações dos moradores</p>
</header>

<main>

<div class="cards">
<div class="card">
<strong id="total">0</strong>
<span>Total de demandas</span>
</div>

<div class="card">
<strong id="pendentes">0</strong>
<span>Pendentes</span>
</div>

<div class="card">
<strong id="encaminhadas">0</strong>
<span>Encaminhadas</span>
</div>

<div class="card">
<strong id="resolvidas">0</strong>
<span>Resolvidas</span>
</div>
</div>


<!-- NOVA DEMANDA -->

<section id="secaoNova">
<h2>➕ Nova demanda</h2>

<form id="form">

<label>Nome do morador *</label>
<input id="nome" required>

<div class="row">

<div>
<label>Telefone</label>
<input id="telefone">
</div>

<div>
<label>Número da casa</label>
<input id="numero">
</div>

</div>

<div class="row">

<div>
<label>Rua</label>
<input id="rua">
</div>

<div>
<label>Bairro</label>
<input id="bairro">
</div>

</div>

<div class="row">

<div>
<label>Quadra</label>
<input id="quadra">
</div>

<div>
<label>Lote</label>
<input id="lote">
</div>

</div>

<label>Categoria *</label>

<select id="categoria" required>

<option value="">Selecione</option>

<option>Iluminação pública</option>
<option>Rua / pavimentação</option>
<option>Limpeza / lixo</option>
<option>Água / esgoto</option>
<option>Saúde</option>
<option>Obras</option>
<option>Outro</option>

</select>

<label>Descrição da demanda *</label>
<textarea id="descricao" required></textarea>

<div class="row">

<div>
<label>Prioridade</label>

<select id="prioridade">
<option>Normal</option>
<option>Alta</option>
<option>Urgente</option>
</select>

</div>

<div>
<label>Secretaria responsável</label>
<input id="secretaria" placeholder="Ex.: Obras">
</div>

</div>

<label>Localização GPS</label>

<div class="row">

<div>
<input id="latitude" placeholder="Latitude" readonly>
</div>

<div>
<input id="longitude" placeholder="Longitude" readonly>
</div>

</div>

<button
type="button"
id="gpsBtn"
style="width:100%;margin-top:10px;background:#eef5ff;color:#1769d1">

📍 Capturar localização atual

</button>

<div
id="gpsStatus"
style="font-size:13px;color:#687386;margin-top:7px">
</div>

<label>Foto</label>
<input id="foto" type="file" accept="image/*">

<button class="primary" type="submit">
Salvar demanda
</button>

<div class="success" id="ok">
✓ Demanda salva com sucesso!
</div>

</form>
</section>


<!-- LISTA -->

<section id="secaoLista">

<h2>🔎 Demandas cadastradas</h2>

<input
class="search"
id="busca"
placeholder="Pesquisar por nome, rua, bairro ou categoria">

<div class="list" id="lista"></div>

</section>


<!-- DETALHES DA DEMANDA -->

<section class="detalhes" id="detalhes">

<h2>📋 Detalhes da demanda</h2>

<div id="conteudoDetalhes"></div>

<div class="botoes-detalhes">

<button
class="primary"
type="button"
id="editarBtn">

✏️ Editar demanda

</button>

<button
class="secondary"
type="button"
id="voltarBtn">

← Voltar para demandas

</button>

</div>

</section>


<!-- EDIÇÃO -->

<section class="edicao" id="secaoEdicao">

<h2>✏️ Editar demanda</h2>

<form id="formEdicao">

<label>Nome do morador *</label>
<input id="edit_nome" required>

<div class="row">

<div>
<label>Telefone</label>
<input id="edit_telefone">
</div>

<div>
<label>Número da casa</label>
<input id="edit_numero">
</div>

</div>

<div class="row">

<div>
<label>Rua</label>
<input id="edit_rua">
</div>

<div>
<label>Bairro</label>
<input id="edit_bairro">
</div>

</div>

<div class="row">

<div>
<label>Quadra</label>
<input id="edit_quadra">
</div>

<div>
<label>Lote</label>
<input id="edit_lote">
</div>

</div>

<label>Categoria *</label>

<select id="edit_categoria" required>

<option value="">Selecione</option>
<option>Iluminação pública</option>
<option>Rua / pavimentação</option>
<option>Limpeza / lixo</option>
<option>Água / esgoto</option>
<option>Saúde</option>
<option>Obras</option>
<option>Outro</option>

</select>

<label>Descrição da demanda *</label>

<textarea id="edit_descricao" required></textarea>

<div class="row">

<div>

<label>Prioridade</label>

<select id="edit_prioridade">
<option>Normal</option>
<option>Alta</option>
<option>Urgente</option>
</select>

</div>

<div>

<label>Secretaria responsável</label>
<input id="edit_secretaria">

</div>

</div>

<label>Status</label>

<select id="edit_status">

<option>Pendente</option>
<option>Encaminhada</option>
<option>Resolvida</option>

</select>

<label>Latitude</label>
<input id="edit_latitude" readonly>

<label>Longitude</label>
<input id="edit_longitude" readonly>

<div class="botoes-detalhes">

<button
class="primary"
type="submit">

💾 Salvar alterações

</button>

<button
class="secondary"
type="button"
id="cancelarEdicao">

Cancelar

</button>

</div>

<div class="success" id="okEdicao">
✓ Demanda alterada com sucesso!
</div>

</form>

</section>

</main>


<script>

const KEY='gestor_demandas_v1';

let demandas=JSON.parse(localStorage.getItem(KEY)||'[]');

let demandaSelecionada=null;

const $=id=>document.getElementById(id);


/* ATUALIZA OS CONTADORES */

function atualizar(){

$('total').textContent=demandas.length;

$('pendentes').textContent=
demandas.filter(x=>x.status==='Pendente').length;

$('encaminhadas').textContent=
demandas.filter(x=>x.status==='Encaminhada').length;

$('resolvidas').textContent=
demandas.filter(x=>x.status==='Resolvida').length;

render();

}


/* LISTA */

function render(){

const q=$('busca').value.toLowerCase();

const arr=demandas.filter(x=>

[
x.nome,
x.rua,
x.bairro,
x.categoria
].join(' ').toLowerCase().includes(q)

);

$('lista').innerHTML=arr.length ?

arr.map(x=>`

<div
class="item"
data-id="${x.id}">

<b>${esc(x.nome)}</b>

<div>
${esc(x.rua||'')}
${esc(x.numero||'')}
—
${esc(x.bairro||'')}
</div>

<div style="margin-top:7px">

<span class="tag">
${esc(x.categoria)}
</span>

<span class="tag">
${esc(x.status)}
</span>

</div>

<div
style="font-size:13px;color:#687386;margin-top:7px">

${esc(x.descricao)}

</div>

${x.latitude&&x.longitude?

`<div
style="font-size:12px;margin-top:7px">

📍 ${esc(x.latitude)}, ${esc(x.longitude)}

</div>`

:''}

<div
style="font-size:12px;color:#1769d1;margin-top:8px;font-weight:bold">

👆 Toque para abrir a demanda

</div>

</div>

`).join('')

:

'<p style="color:#687386">
Nenhuma demanda encontrada.
</p>';

}


/* ABRIR DEMANDA */

$('lista').addEventListener('click',function(e){

const item=e.target.closest('.item');

if(!item)return;

const id=Number(item.dataset.id);

abrirDemanda(id);

});


function abrirDemanda(id){

const d=demandas.find(x=>x.id===id);

if(!d)return;

demandaSelecionada=d;

$('secaoNova').style.display='none';
$('secaoLista').style.display='none';
$('secaoEdicao').style.display='none';

$('detalhes').style.display='block';

$('conteudoDetalhes').innerHTML=`

<div class="detalhe-box">
<div class="detalhe-label">Morador</div>
<div class="detalhe-valor">${esc(d.nome)}</div>
</div>

<div class="detalhe-box">
<div class="detalhe-label">Telefone</div>
<div class="detalhe-valor">${esc(d.telefone||'Não informado')}</div>
</div>

<div class="detalhe-box">
<div class="detalhe-label">Endereço</div>
<div class="detalhe-valor">
${esc(d.rua||'')}
${d.numero?' nº '+esc(d.numero):''}
${d.bairro?' - '+esc(d.bairro):''}
</div>
</div>

<div class="row">

<div class="detalhe-box">
<div class="detalhe-label">Quadra</div>
<div class="detalhe-valor">${esc(d.quadra||'Não informado')}</div>
</div>

<div class="detalhe-box">
<div class="detalhe-label">Lote</div>
<div class="detalhe-valor">${esc(d.lote||'Não informado')}</div>
</div>

</div>

<div class="detalhe-box">
<div class="detalhe-label">Categoria</div>
<div class="detalhe-valor">${esc(d.categoria)}</div>
</div>

<div class="detalhe-box">
<div class="detalhe-label">Descrição</div>
<div class="detalhe-valor">${esc(d.descricao)}</div>
</div>

<div class="row">

<div class="detalhe-box">
<div class="detalhe-label">Prioridade</div>
<div class="detalhe-valor">${esc(d.prioridade)}</div>
</div>

<div class="detalhe-box">
<div class="detalhe-label">Status</div>
<div class="detalhe-valor">${esc(d.status)}</div>
</div>

</div>

<div class="detalhe-box">
<div class="detalhe-label">Secretaria responsável</div>
<div class="detalhe-valor">${esc(d.secretaria||'Não informado')}</div>
</div>

<div class="detalhe-box">
<div class="detalhe-label">GPS</div>

<div class="detalhe-valor">

${d.latitude&&d.longitude?

`📍 ${esc(d.latitude)}, ${esc(d.longitude)}

<br><br>

<a
href="https://www.google.com/maps?q=${encodeURIComponent(d.latitude+','+d.longitude)}"
target="_blank"
rel="noopener">

🗺️ Abrir localização no Google Maps

</a>`

:

'Localização não registrada'}

</div>
</div>

<div class="detalhe-box">
<div class="detalhe-label">Data do cadastro</div>
<div class="detalhe-valor">${esc(d.data||'')}</div>
</div>

`;

window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* EDITAR */

$('editarBtn').addEventListener('click',function(){

if(!demandaSelecionada)return;

const d=demandaSelecionada;

$('edit_nome').value=d.nome||'';
$('edit_telefone').value=d.telefone||'';
$('edit_numero').value=d.numero||'';
$('edit_rua').value=d.rua||'';
$('edit_bairro').value=d.bairro||'';
$('edit_quadra').value=d.quadra||'';
$('edit_lote').value=d.lote||'';
$('edit_categoria').value=d.categoria||'';
$('edit_descricao').value=d.descricao||'';
$('edit_prioridade').value=d.prioridade||'Normal';
$('edit_secretaria').value=d.secretaria||'';
$('edit_status').value=d.status||'Pendente';
$('edit_latitude').value=d.latitude||'';
$('edit_longitude').value=d.longitude||'';

$('detalhes').style.display='none';

$('secaoEdicao').style.display='block';

window.scrollTo({
top:0,
behavior:'smooth'
});

});


/* SALVAR ALTERAÇÃO */

$('formEdicao').addEventListener('submit',function(e){

e.preventDefault();

if(!demandaSelecionada)return;

const d=demandaSelecionada;

d.nome=$('edit_nome').value;
d.telefone=$('edit_telefone').value;
d.numero=$('edit_numero').value;
d.rua=$('edit_rua').value;
d.bairro=$('edit_bairro').value;
d.quadra=$('edit_quadra').value;
d.lote=$('edit_lote').value;
d.categoria=$('edit_categoria').value;
d.descricao=$('edit_descricao').value;
d.prioridade=$('edit_prioridade').value;
d.secretaria=$('edit_secretaria').value;
d.status=$('edit_status').value;
d.latitude=$('edit_latitude').value;
d.longitude=$('edit_longitude').value;

localStorage.setItem(
KEY,
JSON.stringify(demandas)
);

$('okEdicao').style.display='block';

atualizar();

setTimeout(()=>{

$('okEdicao').style.display='none';

abrirDemanda(d.id);

},1200);

});


/* CANCELAR EDIÇÃO */

$('cancelarEdicao').addEventListener('click',function(){

if(demandaSelecionada){

abrirDemanda(demandaSelecionada.id);

}

});


/* VOLTAR */

$('voltarBtn').addEventListener('click',function(){

$('detalhes').style.display='none';

$('secaoNova').style.display='block';
$('secaoLista').style.display='block';

demandaSelecionada=null;

window.scrollTo({
top:0,
behavior:'smooth'
});

});


/* ESCAPE */

function esc(s){

return String(s||'').replace(
/[&<>"']/g,
m=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[m])

);

}


/* =========================
   GPS
   NÃO ALTERADO
========================= */

$('gpsBtn').addEventListener('click',()=>{

const status=$('gpsStatus');

const btn=$('gpsBtn');

if(!navigator.geolocation){

status.textContent=
'❌ Geolocalização não está disponível neste dispositivo.';

return;

}

btn.disabled=true;

btn.textContent='📍 Obtendo localização...';

status.textContent=
'Procurando sua localização. Aguarde...';


const sucesso=(pos)=>{

const lat=pos.coords.latitude;

const lon=pos.coords.longitude;

const precisao=pos.coords.accuracy;

$('latitude').value=lat.toFixed(6);

$('longitude').value=lon.toFixed(6);

status.textContent=
`✓ Localização capturada (precisão aproximada: ${Math.round(precisao)} m)`;

btn.disabled=false;

btn.textContent=
'📍 Capturar localização atual';

};


const restaurarBotao=()=>{

btn.disabled=false;

btn.textContent=
'📍 Capturar localização atual';

};


const tentativaNormal=()=>{

navigator.geolocation.getCurrentPosition(

sucesso,

(err2)=>{

const msgs={

1:
'❌ Permissão de localização negada. Ative a permissão de localização para este aplicativo nas configurações do Android.',

2:
'❌ Não foi possível determinar a localização. Verifique se a Localização/GPS está ativada.',

3:
'❌ O tempo para obter a localização terminou. Vá para um local com melhor sinal e tente novamente.'

};

status.textContent=
msgs[err2.code]||
'❌ Erro ao obter localização.';

restaurarBotao();

},

{
enableHighAccuracy:false,
timeout:30000,
maximumAge:10000
}

);

};


navigator.geolocation.getCurrentPosition(

sucesso,

(err)=>{

if(err.code===3){

status.textContent=
'⚠️ GPS demorou para responder. Tentando localização de rede...';

tentativaNormal();

return;

}

if(err.code===2){

status.textContent=
'⚠️ GPS não encontrou sinal. Tentando localização de rede...';

tentativaNormal();

return;

}

const msgs={

1:
'❌ Permissão de localização negada. Ative a permissão de localização para este aplicativo nas configurações do Android.',

2:
'❌ Não foi possível determinar a localização.',

3:
'❌ Tempo esgotado ao obter a localização.'

};

status.textContent=
msgs[err.code]||
'❌ Erro ao obter localização.';

restaurarBotao();

},

{
enableHighAccuracy:true,
timeout:30000,
maximumAge:0
}

);

});


/* SALVAR NOVA DEMANDA */

$('form').addEventListener('submit',e=>{

e.preventDefault();

const d={

id:Date.now(),

nome:$('nome').value,

telefone:$('telefone').value,

numero:$('numero').value,

rua:$('rua').value,

bairro:$('bairro').value,

quadra:$('quadra').value,

lote:$('lote').value,

categoria:$('categoria').value,

descricao:$('descricao').value,

prioridade:$('prioridade').value,

secretaria:$('secretaria').value,

latitude:$('latitude').value,

longitude:$('longitude').value,

status:'Pendente',

data:new Date().toLocaleDateString('pt-BR')

};

demandas.unshift(d);

localStorage.setItem(
KEY,
JSON.stringify(demandas)
);

$('form').reset();

$('ok').style.display='block';

setTimeout(()=>
$('ok').style.display='none',
2500
);

atualizar();

});


/* PESQUISA */

$('busca').addEventListener(
'input',
render
);


/* INICIALIZA */

atualizar();


/* SERVICE WORKER */

if('serviceWorker' in navigator){

window.addEventListener(
'load',
()=>navigator.serviceWorker
.register('./sw.js')
.catch(()=>{})
);

}

</script>

</body>
</html>
